name: Release

# Every merge to main publishes the version in pom.xml as a GitHub Release with the
# runnable jar, a Windows MSI installer and a portable Windows zip.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Read and check version
        id: read
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Releasing version $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release version. Set <version> in pom.xml to MAJOR.MINOR.PATCH (no -SNAPSHOT)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION has already been released. Bump the version in pom.xml and merge again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  jar:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/minesweeper-${{ needs.version.outputs.version }}.jar
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build jar
        run: mvn -B -DskipTests package
      - name: Ensure WiX Toolset 3 is installed
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue
          if (-not $wix -and -not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
      - name: Package MSI and portable zip
        shell: pwsh
        run: ./packaging/package-windows.ps1 -Version ${{ needs.version.outputs.version }} -Msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/jpackage/Minesweeper-${{ needs.version.outputs.version }}.msi
            target/jpackage/Minesweeper-${{ needs.version.outputs.version }}-windows.zip
          if-no-files-found: error

  release:
    needs: [version, jar, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Minesweeper ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/minesweeper-${{ needs.version.outputs.version }}.jar
            dist/Minesweeper-${{ needs.version.outputs.version }}.msi
            dist/Minesweeper-${{ needs.version.outputs.version }}-windows.zip
