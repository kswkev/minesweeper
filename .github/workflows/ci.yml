name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # Builds the MSI and portable zip (without publishing) so packaging breaks are caught
  # on the PR rather than during a release.
  package-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build jar
        run: mvn -B -DskipTests package
      - name: Ensure WiX Toolset 3 is installed
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue
          if (-not $wix -and -not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
      - name: Package MSI and portable zip
        shell: pwsh
        run: |
          $version = mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout
          ./packaging/package-windows.ps1 -Version $version -Msi

  # Every merge to main publishes the pom.xml version, so a PR into main must carry a new one.
  version-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check the version has not been released yet
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom.xml version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Version $VERSION is a SNAPSHOT. Set a release version in pom.xml before merging to main."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::v$VERSION has already been released. Bump the version in pom.xml before merging to main."
            exit 1
          fi
